<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Index of {{ dir_name }}</title>
  <style>
    body { font-family: "Courier New", monospace; margin: 24px; color: #222; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    hr { border: none; border-top: 1px solid #bbb; margin: 12px 0; }
    ul { list-style: none; padding: 0; }
    li { padding: 3px 0; }
    a { color: #0645ad; }
    .meta { color: #666; font-size: 12px; margin-top: 16px; }
  </style>
</head>
<body>
  <h1>Index of {{ dir_name }}</h1>
  <hr>
  <ul>
    <li><a href="/">../</a></li>
    {% for f in files %}
      <li><a href="{{ dir_name }}{{ f }}">{{ f }}</a></li>
    {% endfor %}
  </ul>
  <hr>
  <div class="meta">GuardianMart internal static file server</div>
</body>
</html>
